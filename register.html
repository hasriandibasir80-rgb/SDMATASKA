<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - SDMATASKA</title>
    <link rel="stylesheet" href="css/core/variables.css">
    <link rel="stylesheet" href="css/core/reset.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/forms.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box" style="max-width: 500px;">
            <h2>Registrasi Akun Sekolah</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="regNama" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>NIP</label>
                    <input type="text" id="regNip" required>
                </div>
                <div class="form-group">
                    <label>Asal Sekolah</label>
                    <input type="text" id="regSekolah" required>
                </div>
                <div class="form-group">
                    <label>No. NPSN</label>
                    <input type="text" id="regNpsn" required>
                </div>
                <div class="form-group">
                    <label>Nama Kepala Sekolah</label>
                    <input type="text" id="regNamaKepsek" required>
                </div>
                <div class="form-group">
                    <label>NIP Kepala Sekolah</label>
                    <input type="text" id="regNipKepsek" required>
                </div>
                <div class="form-group">
                    <label>Jabatan</label>
                    <select id="regJabatan" required>
                        <option value="">Pilih Jabatan</option>
                        <option value="admin_sekolah">Admin Sekolah</option>
                        <option value="kepsek">Kepala Sekolah</option>
                        <option value="guru_kelas">Guru Kelas</option>
                        <option value="guru_mapel">Guru Mapel</option>
                        <option value="tendik">Tendik</option>
                       <option value="siswa">Siswa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Daftar</button>
                <p class="text-center mt-3">Sudah punya akun? <a href="index.html">Login di sini</a></p>
            </form>
        </div>
    </div>
    <script type="module" src="js/auth/register-service.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrasi Guru - SDMATASKA</title>
  <link rel="stylesheet" href="../css/layout/dashboard.css">
  <link rel="stylesheet" href="../css/components/feature-grid.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>SDMATASKA</h2>
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-details">
            <p class="user-name" id="user-name">Loading...</p>
            <p class="user-role" id="user-role">-</p>
          </div>
        </div>
      </div>
      <nav class="sidebar-menu" id="sidebar-menu"></nav>
      <div class="sidebar-footer">
        <p class="school-info" id="school-info">-</p>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <button class="menu-toggle" id="menu-toggle"></button>
        <div class="search-bar">
          <input type="text" placeholder="Cari sub-fitur...">
        </div>
       <div class="top-bar-actions">
  <button class="icon-btn">🔔</button>
  <div class="date-display" id="date-display">-</div>
  
  <div class="user-dropdown">
    <button class="user-avatar-btn" id="user-avatar-btn">
      <span class="avatar-circle" id="topbar-avatar">T</span>
    </button>
    <div class="dropdown-menu" id="user-dropdown-menu">
      <a href="../dashboard.html#profil" id="btn-profil">👤 Profil Saya</a>
      <a href="../dashboard.html#pengaturan" id="btn-pengaturan">⚙️ Pengaturan</a>
      <hr>
      <a href="#" id="btn-logout" class="text-danger">🚪 Keluar</a>
    </div>
  </div>
</div>
      </header>

      <div class="content-area">
        <div class="page-header">
          <h1>Administrasi Guru 📚</h1>
          <p>Kelola perangkat pembelajaran dan administrasi mengajar</p>
        </div>
        <div class="feature-grid" id="feature-grid"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { Sidebar } from '../js/ui/sidebar.js';
    
    new Sidebar();

    const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
    if (currentUser.nama) {
      document.getElementById('user-name').textContent = currentUser.nama;
      document.getElementById('user-avatar').textContent = currentUser.nama.charAt(0).toUpperCase();
    }
    if (currentUser.role) {
      document.getElementById('user-role').textContent = currentUser.role.replace('_', ' ').toUpperCase();
    }
    if (currentUser.nama_sekolah) {
      document.getElementById('school-info').textContent = currentUser.nama_sekolah;
    }

    const today = new Date();
    const options = { day: 'numeric', month: 'short', year: 'numeric' };
    document.getElementById('date-display').textContent = today.toLocaleDateString('id-ID', options);

    const subFeatures = [
      { id: 'bank-soal', name: 'Bank Soal', icon: '❓', desc: 'Kelola kumpulan soal untuk berbagai mata pelajaran', status: 'active' },
      { id: 'rpp', name: 'RPP', icon: '📋', desc: 'Rencana Pelaksanaan Pembelajaran', status: 'active' },
      { id: 'cp-tp-atp', name: 'CP-TP-ATP', icon: '🎯', desc: 'Capaian Pembelajaran, Tujuan Pembelajaran, ATP', status: 'active' },
      { id: 'rumus-8-3-3-4', name: 'Rumus 8-3-3-4', icon: '🧮', desc: 'Kalkulator pembagian nilai', status: 'active' },
      { id: 'jurnal', name: 'Jurnal', icon: '📔', desc: 'Jurnal mengajar harian', status: 'active' },
      { id: 'lckh', name: 'LCKH', icon: '📄', desc: 'Lembar Kerja Harian', status: 'coming-soon' },
      { id: 'lkpd', name: 'LKPD', icon: '📝', desc: 'Lembar Kerja Peserta Didik', status: 'coming-soon' },
      { id: 'analisis-kktp', name: 'Analisis KKTP', icon: '', desc: 'Analisis Kriteria Ketercapaian Tujuan Pembelajaran', status: 'coming-soon' },
      { id: 'refleksi', name: 'Refleksi', icon: '💭', desc: 'Refleksi pembelajaran', status: 'coming-soon' },
      { id: 'penilaian', name: 'Penilaian', icon: '', desc: 'Input dan kelola nilai siswa', status: 'active' },
      { id: 'absensi', name: 'Absensi', icon: '✅', desc: 'Catat kehadiran siswa', status: 'active' },
      { id: 'prosem', name: 'Prosem', icon: '', desc: 'Program Semester', status: 'coming-soon' },
      { id: 'prota', name: 'Prota', icon: '', desc: 'Program Tahunan', status: 'coming-soon' },
      { id: 'kalender', name: 'Kalender Pendidikan', icon: '🗓️', desc: 'Kalender akademik', status: 'coming-soon' },
      { id: 'jadwal', name: 'Jadwal Pembelajaran', icon: '⏰', desc: 'Jadwal mengajar', status: 'active' }
    ];

    const gridContainer = document.getElementById('feature-grid');
    subFeatures.forEach(feature => {
      const card = document.createElement('div');
      card.className = `feature-card ${feature.status}`;
      card.innerHTML = `
        <div class="card-icon">${feature.icon}</div>
        <h3>${feature.name}</h3>
        <p>${feature.desc}</p>
        ${feature.status === 'active' 
          ? `<a href="../js/modules/administrasi-guru/${feature.id}.html" class="card-btn">Buka</a>`
          : `<span class="card-badge">Coming Soon</span>`
        }
      `;
      gridContainer.appendChild(card);
    });

    document.getElementById('menu-toggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('active');
    });
  </script>
</body>
</html>

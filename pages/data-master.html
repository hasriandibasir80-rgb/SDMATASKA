<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Master - SDMATASKA</title>
  <link rel="stylesheet" href="../css/layout/dashboard.css">
  <link rel="stylesheet" href="../css/components/feature-grid.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>SDMATASKA</h2>
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-details">
            <p class="user-name" id="user-name">Loading...</p>
            <p class="user-role" id="user-role">-</p>
          </div>
        </div>
      </div>
      <nav class="sidebar-menu" id="sidebar-menu"></nav>
      <div class="sidebar-footer">
        <p class="school-info" id="school-info">-</p>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <div class="search-bar">
          <input type="text" placeholder="Cari data master...">
        </div>
        <div class="top-bar-actions">
          <button class="icon-btn"></button>
          <div class="date-display" id="date-display">-</div>
        </div>
      </header>

      <div class="content-area">
        <div class="page-header">
          <h1>Data Master 🗂️</h1>
          <p>Kelola data induk sekolah</p>
        </div>
        <div class="feature-grid" id="feature-grid"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { Sidebar } from '../js/ui/sidebar.js';
    
    new Sidebar();

    const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
    if (currentUser.nama) {
      document.getElementById('user-name').textContent = currentUser.nama;
      document.getElementById('user-avatar').textContent = currentUser.nama.charAt(0).toUpperCase();
    }
    if (currentUser.role) {
      document.getElementById('user-role').textContent = currentUser.role.replace('_', ' ').toUpperCase();
    }
    if (currentUser.nama_sekolah) {
      document.getElementById('school-info').textContent = currentUser.nama_sekolah;
    }

    const today = new Date();
    const options = { day: 'numeric', month: 'short', year: 'numeric' };
    document.getElementById('date-display').textContent = today.toLocaleDateString('id-ID', options);

    const subFeatures = [
      { id: 'siswa', name: 'Data Siswa', icon: '👨🎓', desc: 'Kelola data peserta didik', status: 'active' },
      { id: 'guru', name: 'Data Guru', icon: '👨‍🏫', desc: 'Kelola data guru dan tenaga pendidik', status: 'active' },
      { id: 'kelas', name: 'Data Kelas', icon: '🏫', desc: 'Kelola data kelas dan rombel', status: 'active' },
      { id: 'mapel', name: 'Data Mapel', icon: '📚', desc: 'Kelola mata pelajaran', status: 'active' },
      { id: 'cp', name: 'Data CP', icon: '', desc: 'Capaian Pembelajaran', status: 'coming-soon' },
      { id: 'tp', name: 'Data TP', icon: '', desc: 'Tujuan Pembelajaran', status: 'coming-soon' },
      { id: 'atp', name: 'Data ATP', icon: '', desc: 'Alur Tujuan Pembelajaran', status: 'coming-soon' },
      { id: 'sarana', name: 'Sarana', icon: '🏗️', desc: 'Kelola sarana dan prasarana', status: 'coming-soon' },
      { id: 'kop-administrasi', name: 'Kop Administrasi', icon: '', desc: 'Kelola kop surat dan letterhead', status: 'coming-soon' },
      { id: 'schools', name: 'Data Sekolah', icon: '🏫', desc: 'Kelola data sekolah (Super Admin)', status: 'coming-soon' },
      { id: 'users', name: 'Data Users', icon: '👥', desc: 'Kelola pengguna sistem', status: 'coming-soon' },
      { id: 'letterhead', name: 'Letterhead', icon: '📋', desc: 'Template kop surat', status: 'coming-soon' }
    ];

    const gridContainer = document.getElementById('feature-grid');
    subFeatures.forEach(feature => {
      const card = document.createElement('div');
      card.className = `feature-card ${feature.status}`;
      card.innerHTML = `
        <div class="card-icon">${feature.icon}</div>
        <h3>${feature.name}</h3>
        <p>${feature.desc}</p>
        ${feature.status === 'active' 
          ? `<a href="../js/modules/data-master/${feature.id}.html" class="card-btn">Buka</a>`
          : `<span class="card-badge">Coming Soon</span>`
        }
      `;
      gridContainer.appendChild(card);
    });

    document.getElementById('menu-toggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('active');
    });
  </script>
</body>
</html>

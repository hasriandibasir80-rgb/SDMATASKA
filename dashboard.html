<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - SDMATASKA</title>
  <link rel="stylesheet" href="css/layout/dashboard.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>SDMATASKA</h2>
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-details">
            <p class="user-name" id="user-name">Loading...</p>
            <p class="user-role" id="user-role">-</p>
          </div>
        </div>
      </div>
      <nav class="sidebar-menu" id="sidebar-menu"></nav>
      <div class="sidebar-footer">
        <p class="school-info" id="school-info">-</p>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="top-bar">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <div class="search-bar">
          <input type="text" placeholder="Cari data, siswa, guru...">
        </div>
        <div class="top-bar-actions">
          <button class="icon-btn">🔔</button>
          <div class="date-display" id="date-display">-</div>
          
          <div class="user-dropdown">
            <button class="user-avatar-btn" id="user-avatar-btn">
              <span class="avatar-circle" id="topbar-avatar">A</span>
            </button>
            <div class="dropdown-menu" id="user-dropdown-menu">
              <a href="#" id="btn-profil">👤 Profil Saya</a>
              <a href="#" id="btn-pengaturan">️ Pengaturan</a>
              <hr>
              <a href="#" id="btn-logout" class="text-danger">🚪 Keluar</a>
            </div>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content-area" id="content-area">
        <div class="welcome-section">
          <h1>Selamat datang kembali, <span id="welcome-name">User</span>! 👋</h1>
          <p id="school-badge">SDN 139 LAMANDA • Akreditasi A</p>
        </div>

        <div id="dynamic-content">
          <p>Pilih menu di sidebar untuk memulai.</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { Sidebar } from './js/ui/sidebar.js';
    
    new Sidebar();

    const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
    
    if (currentUser.nama) {
      document.getElementById('user-name').textContent = currentUser.nama;
      document.getElementById('welcome-name').textContent = currentUser.nama;
      document.getElementById('user-avatar').textContent = currentUser.nama.charAt(0).toUpperCase();
      document.getElementById('topbar-avatar').textContent = currentUser.nama.charAt(0).toUpperCase();
    }
    
    if (currentUser.role) {
      document.getElementById('user-role').textContent = currentUser.role.replace('_', ' ').toUpperCase();
    }
    
    if (currentUser.nama_sekolah) {
      document.getElementById('school-info').textContent = currentUser.nama_sekolah;
      document.getElementById('school-badge').textContent = `${currentUser.nama_sekolah} • NPSN: ${currentUser.npsn}`;
    }

    const today = new Date();
    const options = { day: 'numeric', month: 'short', year: 'numeric' };
    document.getElementById('date-display').textContent = today.toLocaleDateString('id-ID', options);

    const avatarBtn = document.getElementById('user-avatar-btn');
    const dropdownMenu = document.getElementById('user-dropdown-menu');

    avatarBtn?.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });

    document.addEventListener('click', () => dropdownMenu.classList.remove('show'));

    document.getElementById('btn-logout')?.addEventListener('click', (e) => {
      e.preventDefault();
      if (confirm('Apakah Anda yakin ingin keluar?')) {
        sessionStorage.removeItem('currentUser');
        window.location.href = 'index.html';
      }
    });

    document.getElementById('menu-toggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('active');
    });
  </script>
</body>
</html>
